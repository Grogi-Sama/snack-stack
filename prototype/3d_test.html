<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Test</title>
<style>
  html,body{ margin:0; height:100%; background:#EAF6D8; }
  #wrap{ width:420px; height:420px; margin:20px auto; border-radius:20px; overflow:hidden; background:#D9C393; }
  canvas{ display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var CELL = 58, TILE_H = 16, COLS=3, ROWS=3;
var BOARD_W = COLS*CELL, BOARD_H = ROWS*CELL;

var scene = new THREE.Scene();

var wrap = document.getElementById("wrap");
var w = wrap.clientWidth, h = wrap.clientHeight;

// Orthographic camera: gercek boyut orani korunur, kenarlarda bozulma/perspektif olmaz.
var viewSize = Math.max(BOARD_W, BOARD_H) * 0.72;
var aspect = w/h;
var camera = new THREE.OrthographicCamera(-viewSize*aspect, viewSize*aspect, viewSize, -viewSize, 1, 2000);

// Kamera acisi: tepeden hafif egik (izometrik hissi), ama ORTHOGRAPHIC oldugu icin kenar taslar bozulmuyor.
var elevDeg = 58; // yerden yukselme acisi
var elev = elevDeg * Math.PI/180;
var dist = 500;
camera.position.set(0, Math.sin(elev)*dist, Math.cos(elev)*dist);
camera.lookAt(0,0,0);

var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(w,h,false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

var ambient = new THREE.AmbientLight(0xfff2d8, 0.75);
scene.add(ambient);
var key = new THREE.DirectionalLight(0xfff6e0, 1.0);
key.position.set(-140,260,190);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-260; key.shadow.camera.right=260;
key.shadow.camera.top=260; key.shadow.camera.bottom=-260;
key.shadow.camera.near=50; key.shadow.camera.far=800;
key.shadow.bias=-0.0015;
scene.add(key);
var fill = new THREE.DirectionalLight(0xbfd8ff,0.25);
fill.position.set(160,140,-120);
scene.add(fill);

var groundGeo = new THREE.PlaneGeometry(3000,3000);
var groundMat = new THREE.MeshStandardMaterial({ color:0xD9C393, roughness:0.95 });
var ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1;
ground.receiveShadow = true;
scene.add(ground);

var icons = ["tentacle","eyesoup","glowshroom","alienleg","wormnoodle","crystalshrimp","ooze","spikefruit","alienegg"];
var loader = new THREE.TextureLoader();
var idx=0;
for(var r=0;r<ROWS;r++){
  for(var c=0;c<COLS;c++){
    var icon = icons[idx % icons.length]; idx++;
    var tex = loader.load("../assets/icons/ic_"+icon+".png");
    if(tex.colorSpace!==undefined) tex.colorSpace = THREE.SRGBColorSpace;
    var sideMat = new THREE.MeshStandardMaterial({ color:0xC9A96B, roughness:0.85 });
    var topMat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.5, metalness:0.04 });
    var geo = new THREE.BoxGeometry(CELL-3, TILE_H, CELL-3);
    var mats = [sideMat,sideMat,topMat,sideMat,sideMat,sideMat];
    var mesh = new THREE.Mesh(geo, mats);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.position.set(c*CELL - BOARD_W/2 + CELL/2, TILE_H/2, r*CELL - BOARD_H/2 + CELL/2);
    scene.add(mesh);
  }
}

function loop(){
  requestAnimationFrame(loop);
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
